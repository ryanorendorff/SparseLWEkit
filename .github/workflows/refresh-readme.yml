name: Refresh README

on:
  schedule:
    # 06:00 UTC on the 1st of each month.
    - cron: "0 6 1 * *"
  workflow_dispatch:
  push:
    branches: [ci/refresh-readme]  # TODO: remove before merging — exists so the workflow can be exercised before it lands on the default branch.

# Read-only by default; the assemble job upgrades to contents:write to push back.
permissions:
  contents: read

concurrency:
  group: refresh-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      short_sha: ${{ steps.bump.outputs.short_sha }}
      ids: ${{ steps.matrix.outputs.ids }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bump lattice-estimator submodule to upstream HEAD
        id: bump
        run: |
          set -euo pipefail
          git submodule update --remote --recursive src/lattice_estimator
          sha=$(git -C src/lattice_estimator rev-parse HEAD)
          short=$(git -C src/lattice_estimator rev-parse --short HEAD)
          echo "lattice-estimator HEAD: $sha"
          {
            echo "sha=$sha"
            echo "short_sha=$short"
          } >> "$GITHUB_OUTPUT"

      - name: Compute shard matrix from parameter_db.csv
        id: matrix
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pandas
          ids=$(python3 -c "import json,pandas as pd; print(json.dumps(pd.read_csv('src/data/parameter_db.csv')['ID'].tolist()))")
          echo "matrix ids: $ids"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  estimate:
    needs: prepare
    runs-on: ubuntu-24.04
    container:
      image: sagemath/sagemath:latest
      options: --user root
    defaults:
      run:
        # The sagemath container's default shell is dash, which does not
        # support `set -o pipefail`. Force bash for all run steps in this job.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.prepare.outputs.ids) }}
    timeout-minutes: 350
    steps:
      - name: Install git in container
        # sagemath/sagemath:latest doesn't ship git; without it actions/checkout
        # falls back to a tarball download and later git commands fail.
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      - name: Clone lattice-estimator at the prepared SHA
        run: |
          set -euo pipefail
          rm -rf src/lattice_estimator
          git clone https://github.com/malb/lattice-estimator.git src/lattice_estimator
          git -C src/lattice_estimator checkout ${{ needs.prepare.outputs.sha }}

      - name: Install Python deps into Sage's interpreter
        run: sage --pip install --no-warn-script-location -r src/requirements.txt

      - name: Estimate parameter set ID ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p out
          sage --python src/estimate_security.py \
            --ids ${{ matrix.id }} \
            --output out/partial-${{ matrix.id }}.csv \
            --jobs 2

      - name: Show estimates for ID ${{ matrix.id }}
        if: always()
        run: |
          echo "::group::Estimates for parameter set ${{ matrix.id }}"
          if [[ -f out/partial-${{ matrix.id }}.csv ]]; then
            (command -v column >/dev/null && column -s, -t out/partial-${{ matrix.id }}.csv) || cat out/partial-${{ matrix.id }}.csv
          else
            echo "(no partial CSV produced — estimator failed before writing output)"
          fi
          echo "::endgroup::"

      - name: Upload partial CSV
        uses: actions/upload-artifact@v4
        with:
          name: estimates-${{ matrix.id }}
          path: out/partial-${{ matrix.id }}.csv
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [prepare, estimate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (full history, with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pin lattice-estimator submodule to prepare's SHA
        run: |
          set -euo pipefail
          cd src/lattice_estimator
          git fetch --unshallow origin 2>/dev/null || git fetch origin
          git checkout ${{ needs.prepare.outputs.sha }}

      - name: Download all partial CSVs
        uses: actions/download-artifact@v4
        with:
          path: partials
          pattern: estimates-*

      - name: Install Python deps for merge + README
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages -r src/requirements.txt

      - name: Merge partial CSVs into the canonical estimates file
        run: python3 src/merge_estimates.py 'partials/estimates-*/partial-*.csv'

      - name: Regenerate README
        run: make readme

      - name: Open auto-merge PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Check only the paths we actually commit — actions/download-artifact
          # leaves an untracked `partials/` dir that would otherwise make a
          # plain `git status --porcelain` always non-empty.
          tracked_paths=(src/lattice_estimator src/data/lattice_estimator_estimates.csv README.md)
          if [[ -z "$(git status --porcelain -- "${tracked_paths[@]}")" ]]; then
            echo "No changes to estimator pin, estimates, or README — nothing to commit."
            exit 0
          fi

          base="${GITHUB_REF_NAME}"
          # GITHUB_RUN_ID disambiguates against same-second collisions if two
          # workflow runs ever reach this step concurrently.
          branch="chore/refresh-readme-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          short_sha="${{ needs.prepare.outputs.short_sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add -- "${tracked_paths[@]}"
          git commit -m "chore: monthly estimator refresh (lattice-estimator ${short_sha})"
          git push origin "$branch"

          body=$(cat <<EOF
          Automated refresh from the \`Refresh README\` workflow.

          - lattice-estimator submodule resolved to upstream main HEAD: \`${short_sha}\`
          - Re-ran the estimator across all parameter sets in \`src/data/parameter_db.csv\`
          - Regenerated \`README.md\` from the refreshed CSV

          Triggered by \`${GITHUB_EVENT_NAME}\` against base \`${base}\` (run [#${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})).

          Auto-merge is enabled for this PR; it will land once required checks pass (or immediately if none are required).
          EOF
          )

          pr_url=$(gh pr create \
            --base "$base" \
            --head "$branch" \
            --title "chore: monthly estimator refresh (lattice-estimator ${short_sha})" \
            --body "$body")

          echo "Opened PR: $pr_url"

          # Auto-merge only this PR. Repo must have "Allow auto-merge" enabled
          # in Settings → General → Pull Requests for this to take effect.
          if ! gh pr merge --auto --squash --delete-branch "$pr_url"; then
            echo "::warning::Could not enable auto-merge on $pr_url. Confirm 'Allow auto-merge' is enabled in repo Settings → General → Pull Requests, then merge the PR manually."
          fi
